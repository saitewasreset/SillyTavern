# Nginx configuration for SillyTavern with static file optimization
# This configuration serves static files directly via Nginx for better performance

# Upstream Node.js backend
upstream sillytavern_backend {
    server sillytavern:8000;
    keepalive 64;
}

# Main server block
server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Security settings
    client_max_body_size 500M;
    client_body_buffer_size 10M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    
    # Timeouts
    client_body_timeout 300s;
    client_header_timeout 300s;
    send_timeout 300s;
    
    # Logging
    access_log /var/log/nginx/sillytavern_access.log;
    error_log /var/log/nginx/sillytavern_error.log warn;
    
    # Root directory for static files
    root /usr/share/nginx/html;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
    
    # === STATIC FILES - Served directly by Nginx ===
    
    # CSS files
    location ~* ^/css/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        access_log off;
        try_files $uri =404;
    }
    
    # JavaScript files (excluding lib.js which is served separately)
    location ~* ^/scripts/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        access_log off;
        try_files $uri =404;
    }
    
    # Images
    location ~* ^/img/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        access_log off;
        try_files $uri =404;
    }
    
    # Web fonts
    location ~* ^/webfonts/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        access_log off;
        try_files $uri =404;
    }
    
    # Sounds/Audio files
    location ~* ^/sounds/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-static";
        access_log off;
        try_files $uri =404;
    }
    
    # Localization files
    location ~* ^/locales/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Served-By "nginx-static";
        try_files $uri =404;
    }
    
    # Compiled lib.js (pre-compiled by Webpack)
    location = /lib.js {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-static";
        try_files $uri =404;
    }
    
    # Static files: favicon, robots.txt, manifest.json, etc.
    location ~* \.(ico|txt|json|xml)$ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Served-By "nginx-static";
        try_files $uri @backend;
    }
    
    # === DYNAMIC CONTENT - Proxied to Node.js backend ===
    
    # API endpoints - all require backend processing
    location /api/ {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        
        # Connection settings
        proxy_set_header Connection "";
        proxy_set_header Upgrade $http_upgrade;
        
        # Request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cloudflare ZeroTrust headers (preserve CF headers)
        proxy_set_header CF-Access-JWT-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Proxy endpoint - CORS proxy
    location /proxy/ {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    
    # Thumbnails - dynamically generated
    location /thumbnail/ {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
    
    # CSRF token endpoint
    location = /csrf-token {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # OAuth callback endpoint
    location /callback {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Version endpoint
    location = /version {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check endpoint for Nginx itself
    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Root and login - require session/authentication handling
    location / {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cloudflare ZeroTrust headers
        proxy_set_header CF-Access-JWT-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        # Session cookie support
        proxy_cookie_path / /;
        
        # Timeouts
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
    
    # Backend fallback for files not found in static locations
    location @backend {
        proxy_pass http://sillytavern_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
